{% load i18n %}
{{ form.non_field_errors }}
{% for field in form %}
    <div class="ops-form-field">
        <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="ops-field-optional">{% trans 'Optional' %}</span>{% endif %}</label>
        {{ field }}
        {{ field.errors }}
    </div>
{% endfor %}
